# Tramplin — пограничный стенд: прокси и наблюдаемость.
stages:
  - lint
  - build
  - deploy

default:
  tags:
    - docker
    - linux

variables:
  CADDY_IMAGE: "$CI_REGISTRY_IMAGE/caddy:$CI_COMMIT_REF_SLUG"
  SSH_USER: "user1"
  SSH_PORT: "15945"
  DEPLOY_PATH: "/home/user1/apps/infra"

.on-merge-and-branches:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: "$CI_COMMIT_BRANCH"

.on-main:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

# --- проверки --------------------------------------------------------------

compose-config:
  extends: .on-merge-and-branches
  stage: lint
  image: docker:27.5.0
  script:
    - export GRAFANA_ADMIN_PASSWORD="$(head -c 12 /dev/urandom | base64)"
    - export ACME_EMAIL=ci@example.com
    - docker compose config --quiet

alloy-fmt:
  extends: .on-merge-and-branches
  stage: lint
  image:
    name: grafana/alloy:v1.19.2
    entrypoint: [""]
  script:
    - alloy fmt observability/alloy/config.alloy > /dev/null

gitleaks:
  extends: .on-merge-and-branches
  stage: lint
  image:
    name: zricethezav/gitleaks:v8.18.2
    entrypoint: [""]
  script:
    - gitleaks detect --source . --no-git --verbose --redact

trivy-config:
  extends: .on-merge-and-branches
  stage: lint
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  script:
    - trivy config --severity HIGH,CRITICAL --exit-code 1 .

# --- сборка ----------------------------------------------------------------

build-caddy:
  extends: .on-main
  stage: build
  image: docker:27.5.0
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - docker build --pull -t "$CADDY_IMAGE" caddy
    - docker run --rm -i -v /var/run/docker.sock:/var/run/docker.sock
      --entrypoint sh aquasec/trivy:latest
      -c "cat > /tmp/ignore && trivy image --ignorefile /tmp/ignore
      --severity HIGH,CRITICAL --exit-code 1 $CADDY_IMAGE" < .trivyignore
    - docker run --rm -i -e ACME_EMAIL=ci@example.com --entrypoint sh "$CADDY_IMAGE"
      -c "cat > /tmp/Caddyfile && caddy validate --adapter caddyfile --config /tmp/Caddyfile"
      < caddy/Caddyfile
    - docker push "$CADDY_IMAGE"
  after_script:
    - docker logout "$CI_REGISTRY"

# --- деплой ----------------------------------------------------------------

deploy:
  extends: .on-main
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | base64 -d | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - printf 'Host *\n  Port %s\n  StrictHostKeyChecking accept-new\n' "$SSH_PORT" > ~/.ssh/config
    - chmod 600 ~/.ssh/config
  script:
    - ssh "$SSH_USER@$SERVER_IP" "mkdir -p $DEPLOY_PATH"
    - scp -r docker-compose.yml caddy observability scripts "$SSH_USER@$SERVER_IP:$DEPLOY_PATH/"
    - scp "$INFRA_ENV" "$SSH_USER@$SERVER_IP:$DEPLOY_PATH/.env"
    - ssh "$SSH_USER@$SERVER_IP" "chmod 600 $DEPLOY_PATH/.env"
    - printf '%s' "$CI_REGISTRY_PASSWORD" |
      ssh "$SSH_USER@$SERVER_IP" "docker login -u $CI_REGISTRY_USER --password-stdin $CI_REGISTRY"
    - ssh "$SSH_USER@$SERVER_IP"
      "CADDY_IMAGE=$CADDY_IMAGE CI_REGISTRY=$CI_REGISTRY bash $DEPLOY_PATH/scripts/deploy.sh"
  environment:
    name: edge
    url: "https://$PROD_DOMAIN"
