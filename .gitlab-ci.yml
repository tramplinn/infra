stages:
  - test
  - build
  - deploy

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: "$CI_COMMIT_BRANCH"

default:
  tags:
    - docker
    - linux

variables:
  CADDY_IMAGE: "$CI_REGISTRY_IMAGE/caddy:$CI_COMMIT_SHORT_SHA"
  DEPLOY_PATH: "/opt/tramplin/production/infra"

compose-config:
  stage: test
  image: docker:29.7.2
  variables:
    ACME_EMAIL: ci@example.com
    GRAFANA_ADMIN_PASSWORD: ci-only-placeholder
    RABBITMQ_PASSWORD: ci-only-placeholder
    JUDGE0_POSTGRES_PASSWORD: ci-only-placeholder
    JUDGE0_REDIS_PASSWORD: ci-only-placeholder
    JUDGE0_AUTH_TOKEN: ci-only-placeholder
  script:
    - docker compose config --quiet

alloy-fmt:
  stage: test
  image:
    name: grafana/alloy:v1.19.2
    entrypoint: [""]
  script:
    - alloy fmt observability/alloy/config.alloy > /dev/null

gitleaks:
  stage: test
  image:
    name: zricethezav/gitleaks:v8.30.1
    entrypoint: [""]
  script:
    - gitleaks detect --source . --no-git --verbose --redact

trivy-config:
  stage: test
  image:
    name: aquasec/trivy:0.74.0
    entrypoint: [""]
  script:
    - trivy config --severity HIGH,CRITICAL --exit-code 1 .

build:
  stage: build
  image: docker:29.7.2
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  retry:
    max: 2
    when:
      - script_failure
      - runner_system_failure
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - docker build --pull --provenance=false -t "$CADDY_IMAGE" caddy
    - docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
      aquasec/trivy:0.74.0 image --scanners vuln
      --severity HIGH,CRITICAL --exit-code 1 "$CADDY_IMAGE"
    - docker run --rm -i -e ACME_EMAIL=ci@example.com
      --entrypoint sh "$CADDY_IMAGE"
      -c 'cat > /tmp/Caddyfile && caddy validate --adapter caddyfile --config /tmp/Caddyfile'
      < caddy/Caddyfile
    - docker push "$CADDY_IMAGE"
  after_script:
    - docker logout "$CI_REGISTRY"
    - docker builder prune -af

deploy:
  stage: deploy
  image: alpine:3.24.1
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  before_script:
    - apk add --no-cache openssh-client
    - export SSH_AUTH_SOCK=/tmp/ssh-agent.sock
    - ssh-agent -a "$SSH_AUTH_SOCK" >/dev/null
    - echo "$SSH_PRIVATE_KEY" | base64 -d | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - printf 'Host *\n  Port %s\n  StrictHostKeyChecking accept-new\n' "$SSH_PORT" > ~/.ssh/config
    - chmod 600 ~/.ssh/config
  script:
    - ssh "$SSH_USER@$SERVER_IP" "mkdir -p $DEPLOY_PATH"
    - scp -r docker-compose.yml judge0.conf caddy observability "$SSH_USER@$SERVER_IP:$DEPLOY_PATH/"
    - scp "$INFRA_ENV" "$SSH_USER@$SERVER_IP:$DEPLOY_PATH/.env"
    - ssh "$SSH_USER@$SERVER_IP" "chmod 600 $DEPLOY_PATH/.env"
    - printf '%s' "$CI_REGISTRY_PASSWORD" |
      ssh "$SSH_USER@$SERVER_IP" "docker login -u $CI_REGISTRY_USER --password-stdin $CI_REGISTRY"
    - |
      ssh "$SSH_USER@$SERVER_IP" \
        "bash -s -- '$DEPLOY_PATH' '$CADDY_IMAGE' '$CI_REGISTRY'" <<'REMOTE'
      set -euo pipefail

      cd "$1"
      export CADDY_IMAGE="$2"
      registry=$3
      compose=(docker compose --env-file .env)

      trap '"${compose[@]}" ps; "${compose[@]}" logs --tail 100' ERR
      trap 'docker logout "$registry" >/dev/null 2>&1 || true' EXIT

      docker network inspect tramplin-edge >/dev/null 2>&1 || docker network create tramplin-edge
      "${compose[@]}" config --quiet
      # The runner and production services share a small Docker host. Remove
      # unused release and CI images before pulling large images such as Judge0.
      docker image prune -af
      df -h /
      "${compose[@]}" pull
      "${compose[@]}" up -d --no-build --remove-orphans --wait --wait-timeout 180
      docker image prune -af
      REMOTE
  environment:
    name: edge
    url: "https://$PROD_DOMAIN"
