stages:
  - lint
  - build
  - deploy

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: "$CI_COMMIT_BRANCH"

default:
  tags:
    - docker
    - linux

variables:
  SSH_USER: "user1"
  SSH_PORT: "15945"
  DEPLOY_PATH: "/home/$SSH_USER/apps/infra"

compose-config:
  stage: lint
  image: docker:29.7.2
  variables:
    ACME_EMAIL: ci@example.com
    GRAFANA_ADMIN_PASSWORD: ci-only-placeholder
    RABBITMQ_PASSWORD: ci-only-placeholder
    JUDGE0_POSTGRES_PASSWORD: ci-only-placeholder
    JUDGE0_REDIS_PASSWORD: ci-only-placeholder
    JUDGE0_AUTH_TOKEN: ci-only-placeholder
  script:
    - docker compose config --quiet

alloy-fmt:
  stage: lint
  image:
    name: grafana/alloy:v1.19.2
    entrypoint: [""]
  script:
    - alloy fmt observability/alloy/config.alloy > /dev/null

gitleaks:
  stage: lint
  image:
    name: zricethezav/gitleaks:v8.30.1
    entrypoint: [""]
  script:
    - gitleaks detect --source . --no-git --verbose --redact

trivy-config:
  stage: lint
  image:
    name: aquasec/trivy:0.74.0
    entrypoint: [""]
  script:
    - trivy config --severity HIGH,CRITICAL --exit-code 1 .

build-caddy:
  stage: build
  image: docker:29.7.2
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  retry:
    max: 2
    when:
      - script_failure
      - runner_system_failure
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - docker build --pull --provenance=false
      -t "$CI_REGISTRY_IMAGE/caddy:$CI_COMMIT_SHORT_SHA" caddy
    - docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
      aquasec/trivy:0.74.0 image --scanners vuln
      --severity HIGH,CRITICAL --exit-code 1
      "$CI_REGISTRY_IMAGE/caddy:$CI_COMMIT_SHORT_SHA"
    - docker run --rm -i -e ACME_EMAIL=ci@example.com
      --entrypoint sh "$CI_REGISTRY_IMAGE/caddy:$CI_COMMIT_SHORT_SHA"
      -c 'cat > /tmp/Caddyfile && caddy validate --adapter caddyfile --config /tmp/Caddyfile'
      < caddy/Caddyfile
    - docker push "$CI_REGISTRY_IMAGE/caddy:$CI_COMMIT_SHORT_SHA"
  after_script:
    - docker logout "$CI_REGISTRY"

deploy:
  stage: deploy
  image: alpine:3.24.1
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  before_script:
    - apk add --no-cache openssh-client
    - export SSH_AUTH_SOCK=/tmp/ssh-agent.sock
    - ssh-agent -a "$SSH_AUTH_SOCK" >/dev/null
    - echo "$SSH_PRIVATE_KEY" | base64 -d | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - printf 'Host *\n  Port %s\n  StrictHostKeyChecking accept-new\n' "$SSH_PORT" > ~/.ssh/config
    - chmod 600 ~/.ssh/config
  script:
    - ssh "$SSH_USER@$SERVER_IP" "mkdir -p $DEPLOY_PATH"
    - scp -r docker-compose.yml caddy observability scripts "$SSH_USER@$SERVER_IP:$DEPLOY_PATH/"
    - scp "$INFRA_ENV" "$SSH_USER@$SERVER_IP:$DEPLOY_PATH/.env"
    - ssh "$SSH_USER@$SERVER_IP" "chmod 600 $DEPLOY_PATH/.env"
    - printf '%s' "$CI_REGISTRY_PASSWORD" |
      ssh "$SSH_USER@$SERVER_IP" "docker login -u $CI_REGISTRY_USER --password-stdin $CI_REGISTRY"
    - ssh "$SSH_USER@$SERVER_IP"
      "bash $DEPLOY_PATH/scripts/deploy.sh '$CI_REGISTRY_IMAGE/caddy:$CI_COMMIT_SHORT_SHA' '$CI_REGISTRY'"
  environment:
    name: edge
    url: "https://$PROD_DOMAIN"
