stages: [validate, deploy]
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
variables:
  KUBE_CONTEXT: tramplin1/infra:tramplin
default:
  image:
    name: alpine/kubectl:1.37.1
    entrypoint: [""]
  tags: [saas-linux-small-amd64]
  timeout: 90m
validate:
  stage: validate
  script:
    - kubectl kustomize k8s/ > /dev/null
deploy-production:
  stage: deploy
  resource_group: tramplin-production
  environment:
    name: production
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
      when: manual
  allow_failure: false
  script:
    - kubectl config use-context "$KUBE_CONTEXT"
    - sed -i "s/REPLACE_PROJECT_ID/$CI_PROJECT_ID/g" k8s/secrets/store.yaml
    - kubectl apply --dry-run=server -k k8s/ >/dev/null
    - kubectl -n tramplin apply -f k8s/secrets/store.yaml
    - kubectl -n tramplin wait --for=condition=Ready secretstore/gitlab-tramplin-infra --timeout=120s
    - kubectl -n tramplin apply -f k8s/secrets/external-secrets.yaml
    - kubectl -n tramplin wait --for=condition=Ready externalsecret/postgres-admin externalsecret/postgres-app externalsecret/postgres-mcp externalsecret/redis externalsecret/rabbitmq externalsecret/rabbitmq-email externalsecret/gitlab-registry --timeout=180s
    - kubectl apply -k k8s/
    # Import updated RabbitMQ topology on boot, including config-only releases.
    - kubectl -n tramplin rollout restart statefulset/rabbitmq
    - kubectl -n tramplin rollout restart statefulset/piston
    - |
      for service in postgres redis rabbitmq piston; do
        kubectl -n tramplin rollout status "statefulset/$service" --timeout=600s
      done
    - kubectl -n tramplin delete job piston-install --ignore-not-found --wait=true --timeout=60s
    - kubectl create --dry-run=server -f k8s/piston/install-job.yaml >/dev/null
    - kubectl create -f k8s/piston/install-job.yaml
    - |
      if ! kubectl -n tramplin wait --for=condition=Complete job/piston-install --timeout=3660s; then
        kubectl -n tramplin logs job/piston-install --tail=100 || true
        exit 1
      fi
    - kubectl -n tramplin logs job/piston-install --tail=30
    - kubectl -n tramplin get pods,pvc,svc

gitleaks:
  stage: validate
  image:
    name: zricethezav/gitleaks:v8.30.1
    entrypoint: [""]
  script:
    - gitleaks detect --source . --no-git --verbose --redact
