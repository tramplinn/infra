# Secrets are injected by Docker Compose and intentionally do not live here.
JUDGE0_TELEMETRY_ENABLE=false
ENABLE_WAIT_RESULT=false
ENABLE_COMPILER_OPTIONS=false
ENABLE_COMMAND_LINE_ARGUMENTS=false
ENABLE_SUBMISSION_DELETE=false
ENABLE_CALLBACKS=false
ENABLE_ADDITIONAL_FILES=false
USE_DOCS_AS_HOMEPAGE=false

# Число параллельных исполнений = число ядер хоста (8) — было 2, гоняли
# четверть железа впустую, а очередь при всплеске одновременных проверок
# не успевала уложиться в клиентский таймаут ожидания (30с).
COUNT=8
MAX_QUEUE_SIZE=100

AUTHN_HEADER=X-Auth-Token

REDIS_HOST=judge0-redis
POSTGRES_HOST=judge0-db
POSTGRES_DB=judge0
POSTGRES_USER=judge0

CPU_TIME_LIMIT=1
MAX_CPU_TIME_LIMIT=5
CPU_EXTRA_TIME=0.5
MAX_CPU_EXTRA_TIME=1
WALL_TIME_LIMIT=3
MAX_WALL_TIME_LIMIT=10
MEMORY_LIMIT=256000
MAX_MEMORY_LIMIT=512000
MAX_PROCESSES_AND_OR_THREADS=60
MAX_MAX_PROCESSES_AND_OR_THREADS=120
MAX_FILE_SIZE=51200
MAX_MAX_FILE_SIZE=51200
NUMBER_OF_RUNS=1
MAX_NUMBER_OF_RUNS=1
ALLOW_ENABLE_NETWORK=false
ENABLE_NETWORK=false
