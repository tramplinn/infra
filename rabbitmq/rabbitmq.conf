# Топология (очереди/биндинги) — единственный источник истины здесь, не в коде
# приложений. Backend/worker-процессы объявляют очереди с passive=true: если
# определение отсюда не загрузилось, они падают с понятной ошибкой вместо
# того, чтобы молча создать очередь с произвольными параметрами.
management.load_definitions = /etc/rabbitmq/definitions.json

# Подключая свой rabbitmq.conf, мы отключаем автогенерацию образом файла с
# default_user/default_pass из RABBITMQ_DEFAULT_USER/RABBITMQ_DEFAULT_PASS —
# создаём его сами тем же способом, читая те же переменные окружения.
default_user = $(RABBITMQ_DEFAULT_USER)
default_pass = $(RABBITMQ_DEFAULT_PASS)
