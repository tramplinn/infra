# Топология (очереди/биндинги) — единственный источник истины здесь, не в коде
# приложений. Backend/worker-процессы объявляют очереди с passive=true: если
# определение отсюда не загрузилось, они падают с понятной ошибкой вместо
# того, чтобы молча создать очередь с произвольными параметрами.
management.load_definitions = /etc/rabbitmq/definitions.json

# RABBITMQ_DEFAULT_USER/PASS (и default_user/default_pass здесь) создают
# пользователя только на полностью пустой базе — у нас она уже не пустая
# (vhost/очереди из definitions.json), так что это молча не срабатывает.
# Пользователь поэтому объявлен в самом definitions.json (users/permissions) —
# deploy-скрипт дописывает туда password_hash перед каждым деплоем, это тот
# же импорт, что создаёт очереди, и он ничего существующего не перезаписывает.
