name: tramplin-infra

x-service: &service
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  networks:
    - internal

services:
  caddy:
    <<: *service
    image: ${CADDY_IMAGE:-tramplin-caddy:local}
    build:
      context: ./caddy
    networks:
      - edge
      - internal
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
      PROD_DOMAIN: ${PROD_DOMAIN:-prod.localhost}
      STAGE_DOMAIN: ${STAGE_DOMAIN:-stage.localhost}
      API_PROD_UPSTREAM: ${API_PROD_UPSTREAM:-tramplin-prod-api:8000}
      API_STAGE_UPSTREAM: ${API_STAGE_UPSTREAM:-tramplin-stage-api:8000}
    ports:
      - "${EDGE_BIND_HOST:-0.0.0.0}:${HTTP_PORT:-80}:80"
      - "${EDGE_BIND_HOST:-0.0.0.0}:${HTTPS_PORT:-443}:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    stop_grace_period: 20s
    mem_limit: 256m

  dockerproxy:
    <<: *service
    image: tecnativa/docker-socket-proxy:v0.5.0
    environment:
      CONTAINERS: 1
      IMAGES: 1
      INFO: 1
      EVENTS: 1
      NETWORKS: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    mem_limit: 64m

  alloy:
    <<: *service
    image: grafana/alloy:v1.19.2
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy_data:/var/lib/alloy/data
      - /:/rootfs:ro
      - /proc:/host/proc:ro
      - /sys:/sys:ro
      - /sys:/host/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /run/udev:/run/udev:ro
      - /run/containerd/containerd.sock:/run/containerd/containerd.sock:ro
    cgroup: host
    depends_on:
      - loki
      - prometheus
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/12345"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 20s
    mem_limit: 256m

  prometheus:
    <<: *service
    image: prom/prometheus:v3.14.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=2GB
      - --web.enable-remote-write-receiver
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    mem_limit: 640m

  loki:
    <<: *service
    image: grafana/loki:3.7
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./observability/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    mem_limit: 384m

  grafana:
    <<: *service
    image: grafana/grafana:13.1
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
      - loki
    mem_limit: 384m

networks:
  edge:
    external: true
    name: tramplin-edge
  internal:

volumes:
  caddy_data:
  caddy_config:
  alloy_data:
  prometheus_data:
  loki_data:
  grafana_data:
