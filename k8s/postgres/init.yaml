apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: tramplin
data:
  10-app-user.sh: |
    #!/bin/sh
    set -eu
    : "${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD must not be empty}"
    psql -X --set ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<'SQL'
    \getenv app_password POSTGRES_APP_PASSWORD
    \getenv db_name POSTGRES_DB
    \getenv app_user POSTGRES_APP_USER
    BEGIN;
    CREATE EXTENSION IF NOT EXISTS vector;
    CREATE ROLE :"app_user" LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION
      PASSWORD :'app_password';
    ALTER DATABASE :"db_name" OWNER TO :"app_user";
    REVOKE ALL ON DATABASE :"db_name" FROM PUBLIC;
    REVOKE ALL ON SCHEMA public FROM PUBLIC;
    GRANT USAGE, CREATE ON SCHEMA public TO :"app_user";
    COMMIT;
    SQL
  20-mcp-user.sh: |
    #!/bin/sh
    set -eu
    : "${POSTGRES_MCP_PASSWORD:?POSTGRES_MCP_PASSWORD must not be empty}"
    psql -X --set ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname postgres <<'SQL'
    \getenv mcp_password POSTGRES_MCP_PASSWORD
    \getenv mcp_user POSTGRES_MCP_USER
    \getenv mcp_db POSTGRES_MCP_DB
    CREATE ROLE :"mcp_user" LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION PASSWORD :'mcp_password';
    CREATE DATABASE :"mcp_db" OWNER :"mcp_user";
    REVOKE ALL ON DATABASE :"mcp_db" FROM PUBLIC;
    SQL
    psql -X --set ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_MCP_DB" <<'SQL'
    \getenv mcp_user POSTGRES_MCP_USER
    REVOKE ALL ON SCHEMA public FROM PUBLIC;
    GRANT USAGE, CREATE ON SCHEMA public TO :"mcp_user";
    SQL
