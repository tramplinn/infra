apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: tramplin
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
  - name: postgres
    port: 5432
    targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: tramplin
spec:
  serviceName: postgres
  replicas: 1
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      containers:
      - name: postgres
        image: pgvector/pgvector:pg18
        ports:
        - name: postgres
          containerPort: 5432
        env:
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: tramplin-infra
              key: POSTGRES_DB
        - name: POSTGRES_USER
          value: postgres
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-admin
              key: password
        - name: POSTGRES_APP_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-app
              key: password
        - name: PGDATA
          value: /var/lib/postgresql/18/docker
        - name: POSTGRES_APP_USER
          valueFrom:
            configMapKeyRef:
              name: tramplin-infra
              key: POSTGRES_APP_USER
        - name: POSTGRES_MCP_DB
          valueFrom:
            configMapKeyRef:
              name: tramplin-infra
              key: POSTGRES_MCP_DB
        - name: POSTGRES_MCP_USER
          valueFrom:
            configMapKeyRef:
              name: tramplin-infra
              key: POSTGRES_MCP_USER
        - name: POSTGRES_MCP_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-mcp
              key: password
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            memory: 2Gi
        startupProbe:
          exec:
            command:
            - sh
            - -c
            - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 60
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
          periodSeconds: 10
          timeoutSeconds: 3
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql
        - name: init
          mountPath: /docker-entrypoint-initdb.d
          readOnly: true
        - name: shm
          mountPath: /dev/shm
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
            add:
            - CHOWN
            - DAC_OVERRIDE
            - FOWNER
            - SETGID
            - SETUID
      volumes:
      - name: init
        configMap:
          name: postgres-init
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: 256Mi
      securityContext:
        seccompProfile:
          type: RuntimeDefault
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      storageClassName: local-path
      resources:
        requests:
          storage: 20Gi
