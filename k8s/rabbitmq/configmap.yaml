apiVersion: v1
kind: ConfigMap
metadata:
  name: rabbitmq-config
data:
  rabbitmq.conf: |
    definitions.import_backend = local_filesystem
    definitions.local.path = /etc/rabbitmq/definitions/definitions.json
    vm_memory_high_watermark.relative = 0.6
    disk_free_limit.absolute = 1GB
  definitions.json: |
    {
      "vhosts": [
        {
          "name": "/"
        }
      ],
      "queues": [
        {
          "name": "algorithm-jobs",
          "vhost": "/",
          "durable": true,
          "auto_delete": false,
          "arguments": {
            "x-queue-type": "quorum"
          }
        },
        {
          "name": "embedding-jobs",
          "vhost": "/",
          "durable": true,
          "auto_delete": false,
          "arguments": {
            "x-queue-type": "quorum"
          }
        },
        {
          "name": "email-transactional",
          "vhost": "/",
          "durable": true,
          "auto_delete": false,
          "arguments": {
            "x-queue-type": "quorum",
            "x-delivery-limit": -1
          }
        },
        {
          "name": "email-bulk",
          "vhost": "/",
          "durable": true,
          "auto_delete": false,
          "arguments": {
            "x-queue-type": "quorum",
            "x-delivery-limit": -1
          }
        }
      ]
    }
