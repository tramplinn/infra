apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
spec:
  selector:
    app: rabbitmq
  ports:
  - name: amqp
    port: 5672
    targetPort: amqp
  clusterIP: None
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
spec:
  serviceName: rabbitmq
  replicas: 1
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      - name: definitions
        image: python:3.14.7-alpine3.23
        command:
        - python
        - -c
        - |
          import base64, hashlib, json, os, re
          from pathlib import Path
          config = json.loads(Path('/config/definitions.json').read_text())
          password = Path('/credentials/password').read_bytes()
          salt = os.urandom(4)
          password_hash = base64.b64encode(salt + hashlib.sha256(salt + password).digest()).decode()
          user = os.environ['RABBITMQ_USER']
          config['users'] = [{'name': user, 'password_hash': password_hash, 'hashing_algorithm': 'rabbit_password_hashing_sha256', 'tags': ''}]
          config['permissions'] = [{'user': user, 'vhost': '/', 'configure': '^$', 'write': '.*', 'read': '.*'}]
          email_password = Path('/email-credentials/password').read_bytes()
          email_salt = os.urandom(4)
          email_hash = base64.b64encode(email_salt + hashlib.sha256(email_salt + email_password).digest()).decode()
          email_user = os.environ['RABBITMQ_EMAIL_USER']
          queues = [os.environ['EMAIL_TRANSACTIONAL_QUEUE_NAME'], os.environ['EMAIL_BULK_QUEUE_NAME']]
          config['users'].append({'name': email_user, 'password_hash': email_hash, 'hashing_algorithm': 'rabbit_password_hashing_sha256', 'tags': ''})
          config['permissions'].append({'user': email_user, 'vhost': '/', 'configure': '^$', 'write': '^$', 'read': '^(?:' + '|'.join(re.escape(q) for q in queues) + ')$'})
          Path('/definitions/definitions.json').write_text(json.dumps(config))
        env:
        - name: RABBITMQ_USER
          valueFrom:
            configMapKeyRef:
              name: tramplin-infra
              key: RABBITMQ_USER
        - name: RABBITMQ_EMAIL_USER
          valueFrom:
            configMapKeyRef:
              name: tramplin-infra
              key: RABBITMQ_EMAIL_USER
        - name: EMAIL_TRANSACTIONAL_QUEUE_NAME
          valueFrom:
            configMapKeyRef:
              name: tramplin-infra
              key: EMAIL_TRANSACTIONAL_QUEUE_NAME
        - name: EMAIL_BULK_QUEUE_NAME
          valueFrom:
            configMapKeyRef:
              name: tramplin-infra
              key: EMAIL_BULK_QUEUE_NAME
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
          runAsUser: 10001
        volumeMounts:
        - name: config
          mountPath: /config
          readOnly: true
        - name: credentials
          mountPath: /credentials
          readOnly: true
        - name: definitions
          mountPath: /definitions
        - name: email-credentials
          mountPath: /email-credentials
          readOnly: true
      containers:
      - name: rabbitmq
        image: rabbitmq:4.3.5-alpine
        command: [sh, -ec]
        args:
        - |
          # fsGroup may add group permissions when mounting an existing volume.
          if [ -f /var/lib/rabbitmq/.erlang.cookie ]; then
            chmod 600 /var/lib/rabbitmq/.erlang.cookie
          fi
          exec docker-entrypoint.sh rabbitmq-server
        ports:
        - name: amqp
          containerPort: 5672
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: RABBITMQ_NODENAME
          value: rabbit@$(POD_NAME)
        - name: RABBITMQ_MNESIA_BASE
          value: /var/lib/rabbitmq/mnesia
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
            add:
            - CHOWN
            - DAC_OVERRIDE
            - FOWNER
            - SETGID
            - SETUID
        startupProbe:
          exec:
            command:
            - rabbitmq-diagnostics
            - -q
            - ping
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 60
        readinessProbe:
          exec:
            command:
            - rabbitmq-diagnostics
            - -q
            - check_running
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          exec:
            command:
            - rabbitmq-diagnostics
            - -q
            - ping
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        volumeMounts:
        - name: data
          mountPath: /var/lib/rabbitmq
        - name: config
          mountPath: /etc/rabbitmq/rabbitmq.conf
          subPath: rabbitmq.conf
          readOnly: true
        - name: definitions
          mountPath: /etc/rabbitmq/definitions
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: rabbitmq-config
      - name: credentials
        secret:
          secretName: rabbitmq
          defaultMode: 288
      - name: definitions
        emptyDir:
          medium: Memory
          sizeLimit: 16Mi
      - name: email-credentials
        secret:
          secretName: rabbitmq-email
          defaultMode: 288
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      storageClassName: local-path
      resources:
        requests:
          storage: 5Gi
