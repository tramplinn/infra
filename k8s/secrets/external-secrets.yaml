apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-admin
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: gitlab-tramplin-infra
    kind: SecretStore
  target:
    name: postgres-admin
    creationPolicy: Orphan
    deletionPolicy: Retain
  data:
  - secretKey: password
    remoteRef:
      key: POSTGRES_ADMIN_PASSWORD
---
