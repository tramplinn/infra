apiVersion: v1
kind: Service
metadata:
  name: piston
spec:
  selector:
    app: piston
  ports:
  - name: http
    port: 2000
    targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: piston-headless
spec:
  selector:
    app: piston
  ports:
  - name: http
    port: 2000
    targetPort: http
  clusterIP: None
